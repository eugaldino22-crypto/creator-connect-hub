name: Fix landing header language switcher

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove header switcher only
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/routes/index.tsx')
          text = path.read_text()
          old = '        <div className="flex shrink-0 items-center gap-2">\n          <LanguageSwitcher compact />\n          <Link'
          new = '        <div className="flex shrink-0 items-center gap-2">\n          <Link'
          if old not in text:
              raise SystemExit('Target header language switcher not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx
          git commit -m "Remove duplicate language switcher from landing header"
          git push
